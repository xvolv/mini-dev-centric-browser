<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Dev Browser | Console Test Suite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 32px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-bottom: 32px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            overflow: hidden;
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-header h2 {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            font-size: 0.65rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 500;
        }

        .badge-log { background: #0d4b6e; color: #7dd3fc; }
        .badge-warn { background: #5c3d00; color: #fbbf24; }
        .badge-error { background: #7f1a1a; color: #f87171; }
        .badge-info { background: #1e3a5f; color: #93c5fd; }

        .card-body {
            padding: 20px;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            background: #1e1e1e;
            border: 1px solid #3a3a3a;
            color: #e0e0e0;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #2a2a2a;
            border-color: #4a4a4a;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="grid">
            
            <!-- LOG Card -->
            <div class="card">
                <div class="card-header">
                    <h2>📄 <span style="color: #7dd3fc;">console.log()</span></h2>
                    <span class="badge badge-log">LOG</span>
                </div>
                <div class="card-body">
                    <div class="button-group">
                        <button onclick="simulateUserLogin()">👤 User Login</button>
                        <button onclick="simulateDataLoad()">📦 Data Loaded</button>
                        <button onclick="simulateObjectLog()">📊 Log User Object</button>
                        <button onclick="simulateBatchLogs(5)">📑 Batch (5)</button>
                    </div>
                </div>
            </div>

            <!-- WARN Card -->
            <div class="card">
                <div class="card-header">
                    <h2>⚠️ <span style="color: #fbbf24;">console.warn()</span></h2>
                    <span class="badge badge-warn">WARN</span>
                </div>
                <div class="card-body">
                    <div class="button-group">
                        <button onclick="simulateDeprecatedAPI()">📢 Deprecated API</button>
                        <button onclick="simulateHighMemory()">💾 High Memory Usage</button>
                        <button onclick="simulateSlowResponse()">🐢 Slow Response</button>
                        <button onclick="simulateBatchWarns(3)">⚠️ Batch (3)</button>
                    </div>
                </div>
            </div>

            <!-- ERROR Card -->
            <div class="card">
                <div class="card-header">
                    <h2>❌ <span style="color: #f87171;">console.error()</span></h2>
                    <span class="badge badge-error">ERROR</span>
                </div>
                <div class="card-body">
                    <div class="button-group">
                        <button onclick="simulateNetworkError()">🌐 Network Error</button>
                        <button onclick="simulateValidationError()">📝 Validation Failed</button>
                        <button onclick="simulateDBError()">🗄️ DB Connection Lost</button>
                        <button onclick="simulateBatchErrors(3)">🔥 Batch (3)</button>
                    </div>
                </div>
            </div>

            <!-- INFO Card -->
            <div class="card">
                <div class="card-header">
                    <h2>ℹ️ <span style="color: #93c5fd;">console.info()</span></h2>
                    <span class="badge badge-info">INFO</span>
                </div>
                <div class="card-body">
                    <div class="button-group">
                        <button onclick="simulateUserAction()">🖱️ User Action</button>
                        <button onclick="simulateHealthCheck()">🩺 Health Check</button>
                        <button onclick="simulateAppLoad()">🚀 App Loaded</button>
                        <button onclick="simulateBatchInfos(3)">ℹ️ Batch (3)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ LOG SCENARIOS ============
        function simulateUserLogin() {
            console.log(`User logged in: salhadin_dev (Role: developer) — Session ID: ${Math.random().toString(36).substr(2, 8)}`);
        }

        function simulateDataLoad() {
            console.log(`Data loaded successfully — 47 records fetched from API (Duration: 124ms)`);
        }

        function simulateObjectLog() {
            const userProfile = {
                id: 1001,
                name: "Salhadin Assefa",
                email: "salhadin@minidev.com",
                preferences: { theme: "dark", notifications: true }
            };
            console.log("Current user profile:", userProfile);
        }

        function simulateBatchLogs(count) {
            for(let i = 1; i <= count; i++) {
                console.log(`[Batch ${i}] System heartbeat — Memory: ${Math.floor(Math.random() * 200 + 100)}MB`);
            }
        }

        // ============ WARN SCENARIOS ============
        function simulateDeprecatedAPI() {
            console.warn(`Deprecated API call detected: /api/v1/users/fetch — Use /api/v2/users/list instead`);
        }

        function simulateHighMemory() {
            console.warn(`High memory usage detected: 845MB (Threshold: 800MB)`);
        }

        function simulateSlowResponse() {
            console.warn(`Slow API response: GET /api/dashboard took 3.2s (Expected: <1.5s)`);
        }

        function simulateBatchWarns(count) {
            for(let i = 1; i <= count; i++) {
                console.warn(`Warning ${i}: Threshold approaching 80%`);
            }
        }

        // ============ ERROR SCENARIOS ============
        function simulateNetworkError() {
            console.error(`Network request failed: ECONNREFUSED — Could not connect to https://api.example.com`);
        }

        function simulateValidationError() {
            console.error(`Form validation failed — Field: email. Invalid email format`);
        }

        function simulateDBError() {
            console.error(`Database connection lost — Connection pool exhausted. (Active: 25/25)`);
        }

        function simulateBatchErrors(count) {
            for(let i = 1; i <= count; i++) {
                console.error(`Error ${i}: 500 Internal Server Error`);
            }
        }

        // ============ INFO SCENARIOS ============
        function simulateUserAction() {
            console.info(`User action recorded: Click — Target: save-button`);
        }

        function simulateHealthCheck() {
            console.info(`System health check — All services operational. DB: OK | Cache: OK | API: OK`);
        }

        function simulateAppLoad() {
            console.info(`Application loaded successfully — Load time: 247ms`);
        }

        function simulateBatchInfos(count) {
            for(let i = 1; i <= count; i++) {
                console.info(`Info ${i}: System event recorded`);
            }
        }
    </script>
</body>
</html>
