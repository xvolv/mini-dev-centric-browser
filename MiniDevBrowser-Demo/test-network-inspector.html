<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Dev Browser | API Test Suite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 32px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-bottom: 32px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            overflow: hidden;
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-header h2 {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .method-badge {
            font-size: 0.65rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .method-get { background: #0d4b6e; color: #7dd3fc; }
        .method-post { background: #1e3a5f; color: #93c5fd; }
        .method-put { background: #5c3d00; color: #fbbf24; }
        .method-delete { background: #7f1a1a; color: #f87171; }

        .card-body {
            padding: 20px;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            background: #1e1e1e;
            border: 1px solid #3a3a3a;
            color: #e0e0e0;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #2a2a2a;
            border-color: #4a4a4a;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="grid">
            
            <!-- GET Card -->
            <div class="card">
                <div class="card-header">
                    <h2>📡 <span style="color: #7dd3fc;">GET</span></h2>
                    <span class="method-badge method-get">Retrieve</span>
                </div>
                <div class="card-body">
                    <div class="button-group">
                        <button onclick="getUsers()">GET /api/users</button>
                        <button onclick="getUserById()">GET /api/users/1</button>
                    </div>
                </div>
            </div>

            <!-- POST Card -->
            <div class="card">
                <div class="card-header">
                    <h2>📝 <span style="color: #93c5fd;">POST</span></h2>
                    <span class="method-badge method-post">Create</span>
                </div>
                <div class="card-body">
                    <div class="button-group">
                        <button onclick="createUser()">POST /api/users</button>
                    </div>
                </div>
            </div>

            <!-- PUT Card -->
            <div class="card">
                <div class="card-header">
                    <h2>🔄 <span style="color: #fbbf24;">PUT</span></h2>
                    <span class="method-badge method-put">Update</span>
                </div>
                <div class="card-body">
                    <div class="button-group">
                        <button onclick="updateUser()">PUT /api/users/1</button>
                    </div>
                </div>
            </div>

            <!-- DELETE Card -->
            <div class="card">
                <div class="card-header">
                    <h2>🗑️ <span style="color: #f87171;">DELETE</span></h2>
                    <span class="method-badge method-delete">Remove</span>
                </div>
                <div class="card-body">
                    <div class="button-group">
                        <button onclick="deleteUser()">DELETE /api/users/1</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api';

        // ============ GET ============
        async function getUsers() {
            try {
                const response = await fetch(`${API_BASE}/users`);
                const data = await response.json();
                console.log('GET /users response:', data);
            } catch(e) {
                console.error('GET /users failed:', e.message);
            }
        }

        async function getUserById() {
            try {
                const response = await fetch(`${API_BASE}/users/1`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                console.log('GET /users/1 response:', data);
            } catch(e) {
                console.error('GET /users/1 failed:', e.message);
            }
        }

        // ============ POST ============
        async function createUser() {
            const newUser = {
                name: "Salhadin Demo User",
                username: "salhadin_demo",
                email: "salhadin@demobrowser.com",
                phone: "1-234-567-8900"
            };
            try {
                const response = await fetch(`${API_BASE}/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newUser)
                });
                const data = await response.json();
                console.log('POST /users response:', data);
            } catch(e) {
                console.error('POST /users failed:', e.message);
            }
        }

        // ============ PUT ============
        async function updateUser() {
            const updatedUser = {
                name: "Updated Name via PUT",
                email: "updated@demobrowser.com"
            };
            try {
                const response = await fetch(`${API_BASE}/users/1`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedUser)
                });
                const data = await response.json();
                console.log('PUT /users/1 response:', data);
            } catch(e) {
                console.error('PUT /users/1 failed:', e.message);
            }
        }

        // ============ DELETE ============
        async function deleteUser() {
            try {
                const response = await fetch(`${API_BASE}/users/1`, {
                    method: 'DELETE'
                });
                console.log('DELETE /users/1 completed. Status:', response.status);
            } catch(e) {
                console.error('DELETE /users/1 failed:', e.message);
            }
        }
    </script>
</body>
</html>
